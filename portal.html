<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Team portal | Trustlane Transportation</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="wrap nav"><a class="brand" href="/"><span class="mark">T<span>↗</span></span><span>TRUSTLANE<small>TRANSPORTATION</small></span></a><span>Team portal</span></div></header><main class="wrap portal"><div id="message" role="status" aria-live="polite"></div><section id="login"><h1>Welcome back.</h1><p>Sign in to manage your assigned work.</p><form id="login-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary">Sign in</button></form></section><section id="setup" hidden><h1>Set your password.</h1><form id="setup-form"><label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><button class="button primary">Set password</button></form></section><section id="dashboard" hidden><div class="portal-head"><div><p class="eyebrow">TRUSTLANE TEAM</p><h1>Lead inbox.</h1><p id="who"></p></div><button id="logout">Sign out</button></div><div id="agent-management" hidden><h2>Team access</h2><form id="invite-form"><label>Agent name<input name="name" required maxlength="120"></label><label>Agent email<input name="email" type="email" required maxlength="254"></label><button class="button primary">Invite agent</button></form><div id="agent-list"></div></div><div class="portal-layout"><div><label>Search leads<input id="search" type="search" placeholder="Name, route or vehicle"></label><label>Status<select id="filter"><option value="">All statuses</option><option>New</option><option>Assigned</option><option>Contacted</option><option>Quoted</option><option>Booked</option><option>Closed</option></select></label><div id="leads"></div></div><div id="detail"><p>Select a lead to view its details.</p></div></div></section></main><script src="/portal.js"></script></body></html>
